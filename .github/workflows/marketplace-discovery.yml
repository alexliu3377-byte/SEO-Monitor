name: Google Play and TapTap Discovery

on:
  schedule:
    # Every Tuesday and Friday at 05:47 MYT. The ordinary daily crawler checks
    # already-discovered apps on the other days.
    - cron: '47 21 * * 1,4'
  workflow_dispatch:
    inputs:
      marketplace:
        description: '要扩展的商店'
        required: true
        type: choice
        options: [both, google_play, taptap]
        default: both
      country:
        description: 'Google Play 地区（如 us、my、sg）'
        required: true
        default: us
      limit:
        description: '每个榜单最多发现数量（1-50）'
        required: true
        default: '20'

concurrency:
  group: marketplace-discovery-experiment
  cancel-in-progress: false

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Discover public marketplace applications
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MARKETPLACE: ${{ github.event.inputs.marketplace || 'both' }}
          COUNTRY: ${{ github.event.inputs.country || 'us' }}
          LIMIT: ${{ github.event.inputs.limit || '20' }}
        run: npm run marketplace:discover -- --marketplace="$MARKETPLACE" --country="$COUNTRY" --limit="$LIMIT"
