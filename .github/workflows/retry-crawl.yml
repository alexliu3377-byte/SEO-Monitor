name: SEO Crawl Retry

on:
  workflow_dispatch:
    inputs:
      step:
        description: '重试步骤'
        type: choice
        options: [keywords, weight, rank, rank-title, index-pages]
        default: keywords
  schedule:
    - cron: '30 20 * * *'   # 04:30 MYT — keywords 重试
    - cron: '0 21 * * *'    # 05:00 MYT — weight 重试
    - cron: '30 21 * * *'   # 05:30 MYT — rank 重试
    - cron: '0 22 * * *'    # 06:00 MYT — rank-title 重试
    - cron: '30 22 * * *'   # 06:30 MYT — index-pages 重试

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total: ${{ steps.gen.outputs.total }}
    steps:
      - name: Compute retry matrix (based on actual failed sites)
        id: gen
        env:
          STEP_INPUT: ${{ github.event.inputs.step }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            STEP="$STEP_INPUT"
          elif [ "$EVENT_SCHEDULE" = "30 20 * * *" ]; then
            STEP="keywords"
          elif [ "$EVENT_SCHEDULE" = "0 21 * * *" ]; then
            STEP="weight"
          elif [ "$EVENT_SCHEDULE" = "30 21 * * *" ]; then
            STEP="rank"
          elif [ "$EVENT_SCHEDULE" = "0 22 * * *" ]; then
            STEP="rank-title"
          elif [ "$EVENT_SCHEDULE" = "30 22 * * *" ]; then
            STEP="index-pages"
          else
            STEP="keywords"
          fi

          SB_URL="${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}"
          SB_KEY="${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

          # Today's date in MYT (UTC+8), boundaries as UTC (avoids + in URL query strings)
          read TODAY TODAY_START TODAY_END <<< $(python3 -c "
          from datetime import datetime, timezone, timedelta
          myt = timezone(timedelta(hours=8))
          now = datetime.now(myt)
          today = now.strftime('%Y-%m-%d')
          start_utc = datetime(now.year, now.month, now.day, 0, 0, 0, tzinfo=myt).astimezone(timezone.utc)
          end_utc = datetime(now.year, now.month, now.day, 23, 59, 59, tzinfo=myt).astimezone(timezone.utc)
          print(today, start_utc.strftime('%Y-%m-%dT%H:%M:%SZ'), end_utc.strftime('%Y-%m-%dT%H:%M:%SZ'))
          ")

          # Step 1: Get today's activity IDs for this step
          ACTS=$(curl -sf \
            -H "apikey: ${SB_KEY}" \
            -H "Authorization: Bearer ${SB_KEY}" \
            "${SB_URL}/rest/v1/activity_log?select=id&step=eq.${STEP}&type=eq.cron_task&logged_at=gte.${TODAY_START}&logged_at=lte.${TODAY_END}")
          IDS=$(echo "$ACTS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          print(','.join(d['id'] for d in data))
          ")

          if [ -z "$IDS" ]; then
            echo "今日尚无 ${STEP} 主抓取记录，创建 1 个 no-op job"
            FAILED_COUNT=0
          else
            # Step 2: Count unique failed/empty domains
            SITE_LOGS=$(curl -sf \
              -H "apikey: ${SB_KEY}" \
              -H "Authorization: Bearer ${SB_KEY}" \
              "${SB_URL}/rest/v1/activity_site_log?select=domain&activity_id=in.(${IDS})&status=in.(fail,empty,suspect)")
            FAILED_COUNT=$(echo "$SITE_LOGS" | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          domains = set(d['domain'] for d in data if d.get('domain'))
          print(len(domains))
            ")
          fi

          echo "Step=${STEP} 今日失败/空站: ${FAILED_COUNT}"

          # 2026-08-28：原来是1个失败站点=1个job（追求最大并行），平时失败站点
          # 少没问题，但账号是GitHub Free、同时最多跑20个job——万一某天大批量
          # 站点同时失败/超时（比如爱站限流），这里也会跟主抓取一样瞬间炸出一堆
          # job抢并发额度、排队更久。改成5个失败站点一组，平时(≤5个失败)体感
          # 不变（还是1个job），只在异常大批量失败时才会自动收敛job数。
          RETRY_SPG=5
          TOTAL=$(python3 -c "import math; print(max(1, math.ceil(${FAILED_COUNT}/${RETRY_SPG})))")
          MATRIX=$(python3 -c "import json; print(json.dumps({'group': list(range(${TOTAL}))}))")
          echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
          echo "total=${TOTAL}" >> $GITHUB_OUTPUT
          echo "Groups=${TOTAL}"
  retry:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine step
        id: vars
        env:
          STEP_INPUT: ${{ github.event.inputs.step }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            STEP="$STEP_INPUT"
          elif [ "$EVENT_SCHEDULE" = "30 20 * * *" ]; then
            STEP="keywords"
          elif [ "$EVENT_SCHEDULE" = "0 21 * * *" ]; then
            STEP="weight"
          elif [ "$EVENT_SCHEDULE" = "30 21 * * *" ]; then
            STEP="rank"
          elif [ "$EVENT_SCHEDULE" = "0 22 * * *" ]; then
            STEP="rank-title"
          elif [ "$EVENT_SCHEDULE" = "30 22 * * *" ]; then
            STEP="index-pages"
          else
            STEP="keywords"
          fi
          echo "step=$STEP" >> $GITHUB_OUTPUT
          echo "Retry step: $STEP (group ${{ matrix.group }}/${{ needs.setup.outputs.total }})"

      - name: Cache Playwright browsers
        if: steps.vars.outputs.step == 'rank' || steps.vars.outputs.step == 'rank-title'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.vars.outputs.step == 'rank' || steps.vars.outputs.step == 'rank-title'
        run: npx playwright install --with-deps chromium

      - name: Run retry crawl
        run: |
          if [ "${{ steps.vars.outputs.step }}" = "rank-title" ]; then
            npx tsx scripts/crawl-rank.ts --group=${{ matrix.group }} --total-groups=${{ needs.setup.outputs.total }} --retry-failed
          else
            npx tsx scripts/crawl.ts --step=${{ steps.vars.outputs.step }} --group=${{ matrix.group }} --total-groups=${{ needs.setup.outputs.total }} --retry-failed
          fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
