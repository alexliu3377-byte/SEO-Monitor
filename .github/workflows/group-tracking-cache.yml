name: Group Tracking Cache Refresh

on:
  # Daily execution is chained from retry-crawl.yml after the final retry.
  # Keep this workflow as a manual recovery entry point.
  workflow_dispatch:

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.groups.outputs.matrix }}
    steps:
      - name: Load task groups
        id: groups
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          TASK_GROUPS_JSON=$(curl --fail-with-body --show-error --silent --max-time 60 \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/task_groups?select=id,name&order=name.asc")
          MATRIX=$(TASK_GROUPS_JSON="$TASK_GROUPS_JSON" python3 -c "import json,os; rows=json.loads(os.environ['TASK_GROUPS_JSON']); print(json.dumps({'include':[{'group_id':r['id'],'group_name':r['name']} for r in rows]}, ensure_ascii=False))")
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"

  refresh:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}
    steps:
      - name: Refresh tracking cache - ${{ matrix.group_name }}
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL: ${{ secrets.NEXT_PUBLIC_VERCEL_URL }}
          GROUP_ID: ${{ matrix.group_id }}
        run: |
          RESPONSE=$(curl --fail-with-body --show-error --silent --max-time 330 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/tracking-cache/refresh?groupId=$GROUP_ID")
          echo "$RESPONSE"
          RESPONSE="$RESPONSE" python3 -c "import json,os,sys; sys.exit(0 if json.loads(os.environ['RESPONSE']).get('success') is True else 1)"
