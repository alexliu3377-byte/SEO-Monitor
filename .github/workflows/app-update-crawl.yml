name: App Update Center Experiment

on:
  schedule:
    # 04:17 MYT，逐日补全一批应用的历史版本。
    - cron: '17 20 * * *'
  workflow_dispatch:
    inputs:
      appId:
        description: '单个应用 UUID（留空检查待抓取来源）'
        required: false
        default: ''
      limit:
        description: '本轮最多检查的来源数'
        required: false
        default: '50'

concurrency:
  group: app-update-center-experiment
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Crawl public application update pages
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          APP_ID: ${{ github.event.inputs.appId }}
          SOURCE_LIMIT: ${{ github.event.inputs.limit || '50' }}
        run: npx tsx scripts/app-update-crawl.ts --app-id="$APP_ID" --limit="$SOURCE_LIMIT"
