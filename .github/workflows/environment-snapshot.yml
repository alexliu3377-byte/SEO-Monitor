name: Environment Daily Snapshot

on:
  # Daily execution is chained from retry-crawl.yml after the final retry.
  # Keep this workflow as a manual recovery/backfill entry point.
  workflow_dispatch:
    inputs:
      date:
        description: '目标日期 YYYY-MM-DD（留空=昨天）'
        required: false
        default: ''

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Compute daily snapshot on runner
        env:
          DATE_INPUT: ${{ github.event.inputs.date }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/refresh-derived-cache.ts --kind=environment --date="$DATE_INPUT"
