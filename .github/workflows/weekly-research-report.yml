name: Weekly Research Report

on:
  workflow_dispatch:
    inputs:
      periodStart:
        description: '起始日期 YYYY-MM-DD（留空=上周一）'
        required: false
        default: ''
      periodEnd:
        description: '结束日期 YYYY-MM-DD（留空=上周日）'
        required: false
        default: ''
  schedule:
    - cron: '0 0 * * 1'  # 08:00 MYT 每周一（UTC+8），晚于daily-crawl最后一步(06:45MYT)和environment-snapshot(07:15MYT)

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run weekly research report
        run: npx tsx scripts/research-report.ts --period-start=${{ github.event.inputs.periodStart }} --period-end=${{ github.event.inputs.periodEnd }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
