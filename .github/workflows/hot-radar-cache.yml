name: Hot Radar Cache Refresh

on:
  schedule:
    - cron: '0 0 * * *'  # 08:00 MYT
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call hot-radar refresh API
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          VERCEL_URL: ${{ secrets.NEXT_PUBLIC_VERCEL_URL }}
        run: |
          RESPONSE=$(curl -sf \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$VERCEL_URL/api/hot-radar/refresh")
          echo "$RESPONSE"
          SUCCESS=$(echo "$RESPONSE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('success',''))")
          if [ "$SUCCESS" = "True" ]; then
            echo "Hot radar cache refreshed successfully"
          else
            echo "ERROR: API returned failure"
            exit 1
          fi
