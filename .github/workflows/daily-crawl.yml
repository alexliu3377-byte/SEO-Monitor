name: Daily SEO Crawl

on:
  workflow_dispatch:
    inputs:
      step:
        description: '抓取步骤'
        type: choice
        options: [all, keywords, rank, weight, index-pages, rank-title, tracking]
        default: all
      site:
        description: '单站域名（留空=全部站点，例如 y8l.com）'
        required: false
        default: ''
      date:
        description: '补抓日期 YYYY-MM-DD（留空=今天，仅 rank/rank-title 步骤支持）'
        required: false
        default: ''
  schedule:
    - cron: '5 16 * * *'  # 00:05 MYT (target ~01:05 MYT after ~1h queue) — keywords
    - cron: '30 16 * * *'  # 00:30 MYT (target ~01:30 MYT after ~1h queue) — weight
    - cron: '30 17 * * *'  # 01:30 MYT (target ~02:30 MYT after ~1h queue) — rank
    - cron: '30 18 * * *'  # 02:30 MYT — rank-title
    - cron: '30 19 * * *'  # 03:30 MYT — index-pages
    - cron: '45 22 * * *'  # 06:45 MYT — tracking（index-pages retry 完成后）

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total: ${{ steps.gen.outputs.total }}
    steps:
      - name: Compute job matrix
        id: gen
        env:
          SITE_INPUT: ${{ github.event.inputs.site }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SITE="$SITE_INPUT"
          if [ -n "$SITE" ]; then
            # 单站运行：1 个 job 即可
            echo 'matrix={"group":[0]}' >> $GITHUB_OUTPUT
            echo 'total=1' >> $GITHUB_OUTPUT
            echo "Single-site run ($SITE) → 1 group"
          else
            # 根据 step 决定每组站点上限
            if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
              STEP="${{ github.event.inputs.step }}"
            elif [ "${{ github.event.schedule }}" = "5 16 * * *" ]; then
              STEP="keywords"
            elif [ "${{ github.event.schedule }}" = "30 16 * * *" ]; then
              STEP="weight"
            elif [ "${{ github.event.schedule }}" = "30 17 * * *" ]; then
              STEP="rank"
            elif [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then
              STEP="rank-title"
            elif [ "${{ github.event.schedule }}" = "30 19 * * *" ]; then
              STEP="index-pages"
            elif [ "${{ github.event.schedule }}" = "45 22 * * *" ]; then
              STEP="tracking"
            else
              STEP="all"
            fi
            # 2026-08-28：keywords/rank/weight/默认(all) 这几个步骤共用同一批81个
            # 站点（is_enabled/has_rank_data/has_index_pages 任一开着），SPG从
            # 4-5调到8-10——账号是GitHub Free，同时最多只能跑20个job，SPG=4时
            # rank/weight 单步就切出21个job（加setup job共22个），单这一步就超过
            # 20的上限，导致job排队、一天比一天晚（用户反馈"任务8点多才跑"）。
            # rank-title/tracking/index-pages 站点池小（16/16/3个），本来job数就
            # 远低于20，不用跟着调。
            case "$STEP" in
              keywords)    SPG=10 ;;
              rank)        SPG=10 ;;
              weight)      SPG=10 ;;
              index-pages) SPG=1 ;;
              rank-title)  SPG=2 ;;
              tracking)    SPG=5 ;;
              *)           SPG=10 ;;
            esac
            # rank-title / index-pages / tracking 单独查询各自的开关字段；其余查询有任意抓取开关的站点
            if [ "$STEP" = "rank-title" ] || [ "$STEP" = "tracking" ]; then
              COUNT=$(curl -sf \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/sites?select=id&has_rank_title=eq.true" | \
                python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            elif [ "$STEP" = "index-pages" ]; then
              COUNT=$(curl -sf \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/sites?select=id&has_index_pages=eq.true" | \
                python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            else
              COUNT=$(curl -sf \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/sites?select=id&or=(is_enabled.eq.true,has_rank_data.eq.true,has_index_pages.eq.true)" | \
                python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            fi
            TOTAL=$(python3 -c "import math; print(max(1, math.ceil(${COUNT}/${SPG})))")
            MATRIX=$(python3 -c "import json; print(json.dumps({'group': list(range(${TOTAL}))}))")
            echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
            echo "total=${TOTAL}" >> $GITHUB_OUTPUT
            echo "Step=${STEP} SPG=${SPG} Sites=${COUNT} → Groups=${TOTAL}"
          fi

  crawl:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false          # 一组失败不影响其他组
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine step
        id: vars
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            STEP="${{ github.event.inputs.step }}"
          elif [ "${{ github.event.schedule }}" = "5 16 * * *" ]; then
            STEP="keywords"
          elif [ "${{ github.event.schedule }}" = "30 16 * * *" ]; then
            STEP="weight"
          elif [ "${{ github.event.schedule }}" = "30 17 * * *" ]; then
            STEP="rank"
          elif [ "${{ github.event.schedule }}" = "30 18 * * *" ]; then
            STEP="rank-title"
          elif [ "${{ github.event.schedule }}" = "30 19 * * *" ]; then
            STEP="index-pages"
          elif [ "${{ github.event.schedule }}" = "45 22 * * *" ]; then
            STEP="tracking"
          else
            STEP="all"
          fi
          echo "step=$STEP" >> $GITHUB_OUTPUT
          echo "Running step: $STEP (group ${{ matrix.group }}/${{ needs.setup.outputs.total }})"

      - name: Cache Playwright browsers
        if: steps.vars.outputs.step == 'rank' || steps.vars.outputs.step == 'rank-title'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.vars.outputs.step == 'rank' || steps.vars.outputs.step == 'rank-title'
        run: npx playwright install --with-deps chromium

      - name: Run crawl
        env:
          SITE_INPUT: ${{ github.event.inputs.site }}
          DATE_INPUT: ${{ github.event.inputs.date }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SITE_ARG=""
          if [ -n "$SITE_INPUT" ]; then
            SITE_ARG="--site=$SITE_INPUT"
          fi
          DATE_ARG=""
          if [ -n "$DATE_INPUT" ]; then
            DATE_ARG="--date=$DATE_INPUT"
          fi
          if [ "${{ steps.vars.outputs.step }}" = "rank-title" ]; then
            npx tsx scripts/crawl-rank.ts --group=${{ matrix.group }} --total-groups=${{ needs.setup.outputs.total }} $SITE_ARG $DATE_ARG
          else
            npx tsx scripts/crawl.ts --step=${{ steps.vars.outputs.step }} --group=${{ matrix.group }} --total-groups=${{ needs.setup.outputs.total }} $SITE_ARG $DATE_ARG
          fi
