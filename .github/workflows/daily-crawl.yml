name: Daily SEO Crawl

on:
  workflow_call:
    inputs:
      step:
        type: string
        required: true
      site:
        type: string
        required: false
        default: ''
      date:
        type: string
        required: false
        default: ''
    secrets:
      NEXT_PUBLIC_SUPABASE_URL:
        required: true
      SUPABASE_SERVICE_ROLE_KEY:
        required: true
      CRON_SECRET:
        required: false
      NEXT_PUBLIC_VERCEL_URL:
        required: false
      GEMINI_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      step:
        description: '抓取步骤'
        type: choice
        options: [all, keywords, rank, weight, index-pages, rank-title, tracking]
        default: all
      site:
        description: '单站域名（留空=全部站点，例如 y8l.com）'
        required: false
        default: ''
      date:
        description: '补抓日期 YYYY-MM-DD（留空=今天，仅 rank/rank-title 步骤支持）'
        required: false
        default: ''
  schedule:
    - cron: '5 16 * * *'  # 00:05 MYT — keywords; schedule delivery can be delayed
    - cron: '30 16 * * *'  # 00:30 MYT — weight
    - cron: '30 17 * * *'  # 01:30 MYT — rank
    - cron: '30 18 * * *'  # 02:30 MYT — rank-title
    - cron: '30 19 * * *'  # 03:30 MYT — index-pages
    # Each step retries inside this workflow. Whichever source step really
    # finishes last coordinates tracking and all derived caches.

env:
  DEFER_CRAWL_ROLLUP: 'true'

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total: ${{ steps.gen.outputs.total }}
      step: ${{ steps.gen.outputs.step }}
      site: ${{ steps.gen.outputs.site }}
      date: ${{ steps.gen.outputs.date }}
    steps:
      - name: Compute job matrix
        id: gen
        env:
          SITE_INPUT: ${{ inputs.site || github.event.inputs.site }}
          STEP_INPUT: ${{ inputs.step || github.event.inputs.step }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
          DATE_INPUT: ${{ inputs.date || github.event.inputs.date }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SITE="$SITE_INPUT"
          echo "site=${SITE}" >> $GITHUB_OUTPUT
          if [ -n "$SITE" ]; then
            STEP="${STEP_INPUT:-all}"
            case "$STEP" in
              all|keywords|weight|rank|rank-title|index-pages|tracking) ;;
              *) echo "Invalid crawl step: $STEP" >&2; exit 1 ;;
            esac
            # 单站运行：1 个 job 即可
            echo 'matrix={"group":[0]}' >> $GITHUB_OUTPUT
            echo 'total=1' >> $GITHUB_OUTPUT
            echo "step=${STEP}" >> $GITHUB_OUTPUT
            echo "Single-site run ($SITE) → 1 group"
          else
            # 根据 step 决定每组站点上限
            # A reusable workflow keeps the caller's event name (for example
            # "schedule"), so github.event_name cannot reliably tell us that
            # inputs.step came from workflow_call. Prefer any explicit input.
            if [ -n "$STEP_INPUT" ]; then
              STEP="$STEP_INPUT"
            elif [ "$EVENT_SCHEDULE" = "5 16 * * *" ]; then
              STEP="keywords"
            elif [ "$EVENT_SCHEDULE" = "30 16 * * *" ]; then
              STEP="weight"
            elif [ "$EVENT_SCHEDULE" = "30 17 * * *" ]; then
              STEP="rank"
            elif [ "$EVENT_SCHEDULE" = "30 18 * * *" ]; then
              STEP="rank-title"
            elif [ "$EVENT_SCHEDULE" = "30 19 * * *" ]; then
              STEP="index-pages"
            else
              STEP="all"
            fi
            case "$STEP" in
              all|keywords|weight|rank|rank-title|index-pages|tracking) ;;
              *) echo "Invalid crawl step: $STEP" >&2; exit 1 ;;
            esac
            echo "step=${STEP}" >> $GITHUB_OUTPUT
            # 2026-08-28：keywords/rank/weight/默认(all) 这几个步骤共用同一批81个
            # 站点（is_enabled/has_rank_data/has_index_pages 任一开着），SPG从
            # 4-5调到6——账号是GitHub Free，同时最多只能跑20个job，SPG=4时
            # rank/weight 单步就切出21个job（加setup job共22个），单这一步就超过
            # 20的上限，导致job排队、一天比一天晚（用户反馈"任务8点多才跑"）；
            # SPG=6时约14个job，留足余量，用户明确要求分组不用调到8-10那么大。
            # rank-title/tracking/index-pages 站点池小（16/16/3个），本来job数就
            # 远低于20，不用跟着调。
            case "$STEP" in
              keywords)    SPG=6 ;;
              rank)        SPG=6 ;;
              weight)      SPG=6 ;;
              index-pages) SPG=1 ;;
              rank-title)  SPG=2 ;;
              tracking)    SPG=5 ;;
              *)           SPG=6 ;;
            esac
            # rank-title / index-pages / tracking 单独查询各自的开关字段；其余查询有任意抓取开关的站点
            if [ "$STEP" = "rank-title" ] || [ "$STEP" = "tracking" ]; then
              COUNT=$(curl -sf \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/sites?select=id&has_rank_title=eq.true" | \
                python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            elif [ "$STEP" = "index-pages" ]; then
              COUNT=$(curl -sf \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/sites?select=id&has_index_pages=eq.true" | \
                python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            else
              COUNT=$(curl -sf \
                -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
                -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
                "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/sites?select=id&or=(is_enabled.eq.true,has_rank_data.eq.true,has_index_pages.eq.true)" | \
                python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
            fi
            TOTAL=$(python3 -c "import math; print(max(1, math.ceil(${COUNT}/${SPG})))")
            MATRIX=$(python3 -c "import json; print(json.dumps({'group': list(range(${TOTAL}))}))")
            echo "matrix=${MATRIX}" >> $GITHUB_OUTPUT
            echo "total=${TOTAL}" >> $GITHUB_OUTPUT
            echo "Step=${STEP} SPG=${SPG} Sites=${COUNT} → Groups=${TOTAL}"
          fi

          DATA_DATE="${DATE_INPUT:-$(TZ=Asia/Kuala_Lumpur date +%F)}"
          if [[ ! "$DATA_DATE" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then echo "Invalid data date" >&2; exit 1; fi
          echo "date=$DATA_DATE" >> "$GITHUB_OUTPUT"
          # Mark this full step as running. A previous same-day completion
          # cannot authorize caches while a newer full batch is in progress.
          if [ -z "$SITE" ] && [ "$STEP" != "tracking" ]; then
            BODY=$(python3 -c "import json; names=['keywords','weight','rank'] if '$STEP' == 'all' else ['$STEP']; print(json.dumps([{'data_date':'$DATA_DATE','step':s,'run_id':'${{ github.run_id }}','processing_complete':False,'complete':False,'unresolved':[],'completed_at':None} for s in names]))")
            curl --fail-with-body --show-error --silent --max-time 60 \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" -H "Prefer: resolution=merge-duplicates" \
              -d "$BODY" "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/crawl_step_completion?on_conflict=data_date,step"
          fi

  # Retry immediately after the main matrix finishes. This avoids waiting for
  # a second scheduled workflow, which GitHub can delay by several hours.
  retry_setup:
    needs: [setup, crawl]
    if: ${{ always() && needs.setup.result == 'success' && needs.crawl.result != 'cancelled' && needs.setup.outputs.step != 'all' && needs.setup.outputs.step != 'tracking' }}
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.gen.outputs.matrix }}
      total: ${{ steps.gen.outputs.total }}
      retry_all: ${{ steps.gen.outputs.retry_all }}
    steps:
      - name: Compute immediate retry matrix
        id: gen
        env:
          STEP: ${{ needs.setup.outputs.step }}
          MAIN_RESULT: ${{ needs.crawl.result }}
          DATA_DATE: ${{ needs.setup.outputs.date }}
          ORIGINAL_MATRIX: ${{ needs.setup.outputs.matrix }}
          ORIGINAL_TOTAL: ${{ needs.setup.outputs.total }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          # A job can fail before it writes a per-site failure row. In that
          # case retrying only logged failures would silently do nothing, so
          # rerun the complete step with the original matrix.
          if [ "$MAIN_RESULT" != "success" ]; then
            echo "Main matrix result is $MAIN_RESULT; retrying the full step"
            echo "matrix=$ORIGINAL_MATRIX" >> $GITHUB_OUTPUT
            echo "total=$ORIGINAL_TOTAL" >> $GITHUB_OUTPUT
            echo "retry_all=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          read TODAY_START TODAY_END <<< $(python3 -c "
          from datetime import datetime, timezone, timedelta
          myt = timezone(timedelta(hours=8))
          now = datetime.now(myt)
          start = datetime(now.year, now.month, now.day, tzinfo=myt).astimezone(timezone.utc)
          end = datetime(now.year, now.month, now.day, 23, 59, 59, tzinfo=myt).astimezone(timezone.utc)
          print(start.strftime('%Y-%m-%dT%H:%M:%SZ'), end.strftime('%Y-%m-%dT%H:%M:%SZ'))
          ")
          ACTS=$(curl -sf \
            -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
            -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
            "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/activity_log?select=id&step=eq.${STEP}&type=eq.cron_task&data_date=eq.${DATA_DATE}&crawl_run_id=eq.${{ github.run_id }}")
          IDS=$(echo "$ACTS" | python3 -c "import json,sys; print(','.join(row['id'] for row in json.load(sys.stdin)))")
          if [ -z "$IDS" ]; then
            FAILED_COUNT=0
          else
            SITE_LOGS=$(curl -sf \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              "$NEXT_PUBLIC_SUPABASE_URL/rest/v1/activity_site_log?select=domain&activity_id=in.(${IDS})&status=in.(fail,empty,suspect)")
            FAILED_COUNT=$(echo "$SITE_LOGS" | python3 -c "import json,sys; print(len({row['domain'] for row in json.load(sys.stdin) if row.get('domain')}))")
          fi
          TOTAL=$(python3 -c "import math; print(max(1, math.ceil(${FAILED_COUNT}/5)))")
          MATRIX=$(python3 -c "import json; print(json.dumps({'group': list(range(${TOTAL}))}))")
          echo "Step=$STEP failed/empty sites=$FAILED_COUNT groups=$TOTAL"
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "total=$TOTAL" >> $GITHUB_OUTPUT
          echo "retry_all=false" >> $GITHUB_OUTPUT

  retry:
    needs: [setup, retry_setup]
    if: ${{ needs.retry_setup.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.retry_setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Cache Playwright browsers
        if: needs.setup.outputs.step == 'rank' || needs.setup.outputs.step == 'rank-title'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: needs.setup.outputs.step == 'rank' || needs.setup.outputs.step == 'rank-title'
        run: npx playwright install --with-deps chromium
      - name: Run immediate retry
        env:
          STEP: ${{ needs.setup.outputs.step }}
          RETRY_ALL: ${{ needs.retry_setup.outputs.retry_all }}
          SITE_INPUT: ${{ inputs.site || github.event.inputs.site }}
          DATE_INPUT: ${{ needs.setup.outputs.date }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "$RETRY_ALL" != "true" ]; then EXTRA_ARGS="--retry-failed"; fi
          if [ -n "$SITE_INPUT" ]; then EXTRA_ARGS="$EXTRA_ARGS --site=$SITE_INPUT"; fi
          if [ -n "$DATE_INPUT" ]; then EXTRA_ARGS="$EXTRA_ARGS --date=$DATE_INPUT"; fi
          if [ "$STEP" = "rank-title" ]; then
            npx tsx scripts/crawl-rank.ts --group=${{ matrix.group }} --total-groups=${{ needs.retry_setup.outputs.total }} $EXTRA_ARGS
          else
            npx tsx scripts/crawl.ts --step=$STEP --group=${{ matrix.group }} --total-groups=${{ needs.retry_setup.outputs.total }} $EXTRA_ARGS
          fi

  # Group 0 is not necessarily last. The matrix barrier and immediate retries
  # must finish before one checked rollup and completion marker are published.
  finalize:
    needs: [setup, crawl, retry]
    if: ${{ always() && needs.setup.result == 'success' && needs.crawl.result != 'cancelled' && needs.retry.result != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Finalize all shards and retries
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STEP: ${{ needs.setup.outputs.step }}
          DATA_DATE: ${{ needs.setup.outputs.date }}
          SITE: ${{ needs.setup.outputs.site }}
          TOTAL: ${{ needs.setup.outputs.total }}
          RETRY_RESULT: ${{ needs.retry.result }}
          MAIN_RESULT: ${{ needs.crawl.result }}
        run: |
          if [ "$RETRY_RESULT" = "failure" ]; then echo "::error::Retry matrix failed; refusing to finalize incomplete sources"; exit 1; fi
          if [ "$MAIN_RESULT" != "success" ] && [ "$RETRY_RESULT" != "success" ]; then echo "::error::Main matrix has no successful recovery"; exit 1; fi
          if [ "$STEP" = "all" ]; then
            for PART in keywords weight rank; do
              npx tsx scripts/crawl.ts --finalize --step="$PART" --date="$DATA_DATE" --total-groups="$TOTAL" ${SITE:+--site=$SITE}
            done
          else
            npx tsx scripts/crawl.ts --finalize --step="$STEP" --date="$DATA_DATE" --total-groups="$TOTAL" ${SITE:+--site=$SITE}
          fi

  # First usable morning pass; the complete post-index pass rebuilds again.
  early_radar_refresh:
    needs: [setup, finalize]
    if: ${{ always() && needs.finalize.result == 'success' && needs.setup.outputs.site == '' && (needs.setup.outputs.step == 'keywords' || needs.setup.outputs.step == 'all') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: daily-radar-cache-rebuild
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Refresh each recent date after keyword collection
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/refresh-daily-radar-cache.ts --days=7

  # Whichever source step actually finishes last can claim the derived work.
  # Missing prerequisites are a normal skip, not an hour-long polling job.
  cache_dependencies:
    needs: [setup, finalize]
    if: ${{ always() && needs.finalize.result == 'success' && needs.setup.outputs.site == '' && needs.setup.outputs.step != 'tracking' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      ready: ${{ steps.ready.outputs.ready }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Claim complete-source data derivation
        id: ready
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/crawl.ts --claim-derivation --date=${{ needs.setup.outputs.date }}

  derived_data:
    needs: [setup, cache_dependencies]
    if: ${{ always() && needs.cache_dependencies.result == 'success' && needs.cache_dependencies.outputs.ready == 'true' }}
    uses: ./.github/workflows/derived-crawl-data.yml
    with:
      date: ${{ needs.setup.outputs.date }}
    secrets: inherit
  crawl:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false          # 一组失败不影响其他组
      matrix: ${{ fromJSON(needs.setup.outputs.matrix) }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Determine step
        id: vars
        env:
          STEP_INPUT: ${{ inputs.step || github.event.inputs.step }}
          EVENT_SCHEDULE: ${{ github.event.schedule }}
        run: |
          # workflow_call inherits the caller's event name. The explicit input
          # is therefore the source of truth whenever it is present.
          if [ -n "$STEP_INPUT" ]; then
            STEP="$STEP_INPUT"
          elif [ "$EVENT_SCHEDULE" = "5 16 * * *" ]; then
            STEP="keywords"
          elif [ "$EVENT_SCHEDULE" = "30 16 * * *" ]; then
            STEP="weight"
          elif [ "$EVENT_SCHEDULE" = "30 17 * * *" ]; then
            STEP="rank"
          elif [ "$EVENT_SCHEDULE" = "30 18 * * *" ]; then
            STEP="rank-title"
          elif [ "$EVENT_SCHEDULE" = "30 19 * * *" ]; then
            STEP="index-pages"
          else
            STEP="all"
          fi
          case "$STEP" in
            all|keywords|weight|rank|rank-title|index-pages|tracking) ;;
            *) echo "Invalid crawl step: $STEP" >&2; exit 1 ;;
          esac
          echo "step=$STEP" >> $GITHUB_OUTPUT
          echo "Running step: $STEP (group ${{ matrix.group }}/${{ needs.setup.outputs.total }})"

      - name: Cache Playwright browsers
        if: steps.vars.outputs.step == 'rank' || steps.vars.outputs.step == 'rank-title'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        if: steps.vars.outputs.step == 'rank' || steps.vars.outputs.step == 'rank-title'
        run: npx playwright install --with-deps chromium

      - name: Run crawl
        env:
          SITE_INPUT: ${{ inputs.site || github.event.inputs.site }}
          DATE_INPUT: ${{ needs.setup.outputs.date }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          SITE_ARG=""
          if [ -n "$SITE_INPUT" ]; then
            SITE_ARG="--site=$SITE_INPUT"
          fi
          DATE_ARG=""
          if [ -n "$DATE_INPUT" ]; then
            DATE_ARG="--date=$DATE_INPUT"
          fi
          if [ "${{ steps.vars.outputs.step }}" = "rank-title" ]; then
            npx tsx scripts/crawl-rank.ts --group=${{ matrix.group }} --total-groups=${{ needs.setup.outputs.total }} $SITE_ARG $DATE_ARG
          else
            npx tsx scripts/crawl.ts --step=${{ steps.vars.outputs.step }} --group=${{ matrix.group }} --total-groups=${{ needs.setup.outputs.total }} $SITE_ARG $DATE_ARG
          fi
